name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gateway == 'true') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # buf breaking 需要完整历史以对比 origin/main 的 proto 契约。
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-gateway-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-gateway-

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.71.0

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build embedded Gateway WebUI
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --filter liveagent-workspace --filter @liveagent/gateway-webui...
          pnpm exec turbo run build --filter=@liveagent/gateway-webui

      - name: Proto lint and breaking-change check
        run: make proto-check BUF_BREAKING_AGAINST='../../.git#branch=origin/main,subdir=crates/agent-gateway'

      - name: Check generated protobuf
        run: |
          make proto
          git diff --exit-code -- crates/agent-gateway/internal/proto

      - name: Lint gateway
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: crates/agent-gateway

      - name: Test gateway
        working-directory: crates/agent-gateway
        run: go test ./...

  gateway-docker:
    name: Gateway Docker Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gateway_docker == 'true') }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: liveagent-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker rm -f liveagent-gateway-smoke >/dev/null 2>&1 || true
          docker run -d \
            --name liveagent-gateway-smoke \
            -p 18080:8080 \
            -e LIVEAGENT_GATEWAY_TOKEN=ci-token \
            liveagent-gateway:ci
          trap 'docker rm -f liveagent-gateway-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          echo "Gateway Docker smoke test failed; container logs:"
          docker logs liveagent-gateway-smoke || true
          exit 1

  webui:
    name: Gateway WebUI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.webui == 'true') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-webui-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-webui-

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter @liveagent/gateway-webui...

      - name: Build, lint and test WebUI
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm exec turbo run build lint test --filter=@liveagent/gateway-webui

  gui:
    name: GUI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.gui == 'true' || needs.changes.outputs.release == 'true') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-gui-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-gui-

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        # GUI frontend tests load shared Gateway WebUI modules (including STT adapters).
        # Install that workspace and its transitive dependencies in this isolated job.
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter liveagent... --filter @liveagent/gateway-webui...

      - name: Build, lint and test GUI frontend
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.gui == 'true' }}
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm exec turbo run build lint test:frontend --filter=liveagent

      - name: Test release scripts
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.gui == 'true' || needs.changes.outputs.release == 'true' }}
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm exec turbo run test:release --filter=liveagent

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      gateway_docker: ${{ steps.filter.outputs.gateway_docker }}
      gui: ${{ steps.filter.outputs.gui }}
      release: ${{ steps.filter.outputs.release }}
      rust: ${{ steps.filter.outputs.rust }}
      ui_boundaries: ${{ steps.filter.outputs.ui_boundaries }}
      webui: ${{ steps.filter.outputs.webui }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'crates/agent-gateway/**'
              - 'crates/agent-ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            gateway_docker:
              - 'crates/agent-gateway/**'
              - 'crates/agent-ui/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            webui:
              - 'crates/agent-gateway/web/**'
              - 'crates/agent-gateway/test/webui/**'
              - 'crates/agent-gateway/test/helpers/**'
              - 'crates/agent-ui/**'
              - 'scripts/run-node-tests.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            gui:
              - 'crates/agent-gui/*'
              - 'crates/agent-gui/src/**'
              - 'crates/agent-gui/test/**'
              - 'crates/agent-gui/public/**'
              - 'crates/agent-gateway/web/**'
              - 'crates/agent-gateway/test/helpers/**'
              - 'crates/agent-ui/**'
              - 'scripts/run-node-tests.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            release:
              - 'scripts/release/**'
              - 'crates/agent-gui/test/backend/release-*.test.mjs'
              - 'crates/agent-gui/package.json'
              - 'scripts/run-node-tests.mjs'
              - 'Makefile'
              - '.github/workflows/desktop-release.yml'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/agent-gui/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # build.rs 编译 gateway protos 并从 package.json 读取应用版本。
              - 'crates/agent-gateway/proto/**'
              - 'crates/agent-gui/package.json'
              - '.github/workflows/ci.yml'
            ui_boundaries:
              - 'crates/agent-ui/**'
              - 'crates/agent-gui/src/**'
              - 'crates/agent-gateway/web/src/**'
              - 'scripts/check*.mjs'
              - 'scripts/run-node-tests*.mjs'
              - 'scripts/ui-boundary-declarations*.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

      - name: Summarize affected jobs
        env:
          MATCHED_FILTERS: ${{ steps.filter.outputs.changes }}
        run: echo "Affected filters:${MATCHED_FILTERS}" >> "$GITHUB_STEP_SUMMARY"

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    env:
      # 行号级 debuginfo:显著降低 codegen 与链接开销,同时保留可读的失败回溯。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0
          # 缓存恢复时执行安装脚本(如 ldconfig 触发器),保证测试运行期动态链接可用。
          execute_install_scripts: true

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace 根在仓库根目录(Cargo.lock 与 target/ 均在此),
          # 指向子目录会导致依赖产物完全不被缓存。
          workspaces: .

      - name: Build Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        run: cargo test --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib --no-run

      - name: Test Tauri backend
        env:
          CARGO_TERM_COLOR: always
        # libtest 支持多个过滤器(取并集),单次调用可让各组测试并行执行。
        run: >
          cargo test --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib --
          chat_history ssh_local_forward shell_runner integration_commands::mcp

  ui-boundaries:
    name: Shared UI Boundaries
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui_boundaries == 'true') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-ui-boundaries-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-ui-boundaries-

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter liveagent-workspace --filter @liveagent/ui...

      - name: Run check script tests
        run: pnpm check:script-tests

      - name: Check shared UI dependency boundaries
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm exec turbo run check:boundaries --filter=@liveagent/ui

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff-tree --check --no-commit-id --root -r "${HEAD_SHA}"
          fi
