    <line x1="60" y1="944" x2="500" y2="944" stroke="#0f172a" stroke-opacity="0.055"/>
    <path d="M78 955 l4 4 -4 4" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="960" font-size="11" font-weight="500" fill="#6b7280" style="font-variant-numeric: tabular-nums">1 / 2</text>
