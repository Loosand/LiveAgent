      <text x="102" y="828" font-size="12.5" fill="#3a3f47">Storybook</text>
      <text x="102" y="845" font-size="11" fill="#6b7280">组件 controls 完整，但需要维护第二套构建配置。</text>
      <circle cx="86" cy="870" r="8" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
