    <path d="M78 637 l4 4 -4 4" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="642" font-size="11" font-weight="500" fill="#6b7280" style="font-variant-numeric: tabular-nums">1 / 2</text>
    <path d="M108 641 l4 -4 4 4" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="376" y="630" width="112" height="22" rx="11" fill="#10b981" opacity="0.12"/>
    <path d="M384 641 l3.4 3.4 6.4 -6.4" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="398" y="644" font-size="10.5" font-weight="500" fill="#047857">已提交回答</text>
  </g>

  <!-- ============ 3) 超时 ============ -->
