<svg xmlns="http://www.w3.org/2000/svg" width="560" height="586" viewBox="0 0 560 586" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="560" height="586" rx="24" fill="#eef0f3"/>

  <!-- ============ 1) 单项审批 ============ -->
  <text x="60" y="36" font-size="13" font-weight="600" fill="#111827">单项审批</text>
  <rect x="452" y="22" width="52" height="20" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="478" y="35" font-size="10.5" font-weight="500" fill="#4338ca" text-anchor="middle">1 pending</text>
  <text x="60" y="54" font-size="11" fill="#6b7280">Enter 批准、Esc 拒绝；不会执行命令。</text>

  <g filter="url(#s)">
    <rect x="60" y="66" width="440" height="128" rx="24" fill="#ffffff"/>

    <g stroke="#6b7280" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 88 v14 M78 88 l7 4 -7 4"/>
    </g>
    <text x="91" y="94" font-size="11.5" fill="#6b7280">Bash</text>
    <text x="488" y="94" font-size="10.5" fill="#9ca3af" text-anchor="end" style="font-variant-numeric: tabular-nums">2:59 后自动拒绝</text>

    <text x="76" y="118" font-size="13" font-weight="500" fill="#111827">是否允许执行此 Bash 操作？</text>
    <text x="76" y="138" font-size="11.5" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#6b7280">pnpm --filter liveagent test:frontend</text>

    <rect x="296" y="160" width="88" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="312" y="178" font-size="11" fill="#374151">拒绝</text>
    <rect x="344" y="167" width="28" height="14" rx="4" fill="#f3f4f6"/>
    <text x="358" y="177" font-size="9" fill="#6b7280" text-anchor="middle">Esc</text>

    <rect x="392" y="160" width="80" height="28" rx="6" fill="#4f46e5"/>
    <text x="406" y="178" font-size="11" fill="#ffffff">允许本次</text>
    <rect x="446" y="165" width="18" height="12" rx="3" fill="#ffffff" opacity="0.14"/>
    <text x="455" y="174" font-size="9.5" fill="#ffffff" text-anchor="middle">↵</text>
    <rect x="472" y="160" width="28" height="28" rx="6" fill="#4f46e5"/>
    <line x1="472" y1="160" x2="472" y2="188" stroke="#ffffff" stroke-opacity="0.2"/>
    <path d="M486 172 l-4 4 4 4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ 2) 批量审批 ============ -->
  <text x="60" y="240" font-size="13" font-weight="600" fill="#111827">批量审批</text>
  <rect x="452" y="226" width="52" height="20" rx="10" fill="#4f46e5" opacity="0.12"/>
  <text x="478" y="239" font-size="10.5" font-weight="500" fill="#4338ca" text-anchor="middle">3 pending</text>
  <text x="60" y="258" font-size="11" fill="#6b7280">下拉菜单包含本项免审和全部批准/拒绝。</text>

  <g filter="url(#s)">
    <rect x="60" y="270" width="440" height="128" rx="24" fill="#ffffff"/>

    <g stroke="#6b7280" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 292 v14 M78 292 l7 4 -7 4"/>
    </g>
    <text x="91" y="298" font-size="11.5" fill="#6b7280">Bash</text>
    <text x="488" y="298" font-size="10.5" fill="#9ca3af" text-anchor="end" style="font-variant-numeric: tabular-nums">1 / 3 · 2:59 后自动拒绝</text>

    <text x="76" y="322" font-size="13" font-weight="500" fill="#111827">是否允许执行此 Bash 操作？</text>
    <text x="76" y="342" font-size="11.5" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#6b7280">pnpm build</text>

    <rect x="296" y="364" width="88" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="312" y="382" font-size="11" fill="#374151">拒绝</text>
    <rect x="344" y="371" width="28" height="14" rx="4" fill="#f3f4f6"/>
    <text x="358" y="381" font-size="9" fill="#6b7280" text-anchor="middle">Esc</text>

    <rect x="392" y="364" width="80" height="28" rx="6" fill="#4f46e5"/>
    <text x="406" y="382" font-size="11" fill="#ffffff">允许本次</text>
    <rect x="446" y="369" width="18" height="12" rx="3" fill="#ffffff" opacity="0.14"/>
    <text x="455" y="378" font-size="9.5" fill="#ffffff" text-anchor="middle">↵</text>
    <rect x="472" y="364" width="28" height="28" rx="6" fill="#4f46e5"/>
    <line x1="472" y1="364" x2="472" y2="392" stroke="#ffffff" stroke-opacity="0.2"/>
    <path d="M486 376 l-4 4 4 4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ 3) 提交失败 ============ -->
  <text x="60" y="442" font-size="13" font-weight="600" fill="#111827">提交失败</text>
  <rect x="452" y="428" width="56" height="20" rx="10" fill="#ef4444" opacity="0.12"/>
  <text x="480" y="441" font-size="10.5" font-weight="500" fill="#b91c1c" text-anchor="middle">error path</text>
  <text x="60" y="460" font-size="11" fill="#6b7280">用于核对宿主错误反馈和重试状态。</text>

  <g filter="url(#s)">
    <rect x="60" y="472" width="440" height="100" rx="24" fill="#ffffff"/>

    <g stroke="#6b7280" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 494 v14 M78 494 l7 4 -7 4"/>
    </g>
    <text x="91" y="500" font-size="11.5" fill="#6b7280">Bash</text>
    <text x="488" y="500" font-size="10.5" fill="#9ca3af" text-anchor="end" style="font-variant-numeric: tabular-nums">2:59 后自动拒绝</text>

    <text x="76" y="522" font-size="13" font-weight="500" fill="#111827">是否允许执行此 Bash 操作？</text>
    <text x="76" y="540" font-size="11.5" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#6b7280">git push origin main</text>

    <text x="76" y="564" font-size="10.5" fill="#dc2626">Gallery simulated rejection from the host.</text>
    <rect x="392" y="552" width="80" height="28" rx="6" fill="#4f46e5"/>
    <text x="406" y="570" font-size="11" fill="#ffffff">允许本次</text>
    <rect x="472" y="552" width="28" height="28" rx="6" fill="#4f46e5"/>
    <path d="M486 564 l-4 4 4 4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
